name: iOS Unsigned IPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "同时发布到 Release（例如 v1.0.0，留空则只产出 artifact）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: swift test
        working-directory: packages/WSubscriptionKit
        run: swift test --disable-sandbox

  ipa:
    name: Build unsigned IPA
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Build (no code signing)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WSubscription.xcodeproj \
            -scheme WSubscription \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        working-directory: apps/ios
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "app: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"

          rm -rf Payload W-Sub-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry W-Sub-unsigned.ipa Payload

          shasum -a 256 W-Sub-unsigned.ipa | tee checksum.txt
          ls -lh W-Sub-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-Sub-unsigned-ipa
          path: |
            apps/ios/W-Sub-unsigned.ipa
            apps/ios/checksum.txt
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: W Sub ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            apps/ios/W-Sub-unsigned.ipa
            apps/ios/checksum.txt
          body: |
            ## W Sub ${{ inputs.release_tag || github.ref_name }}

            未签名的 iOS 安装包（`W-Sub-unsigned.ipa`），需要自行签名后安装。

            **安装方式**

            - **AltStore / SideStore / Sideloadly**：导入 ipa，用你自己的 Apple ID 签名。
            - **企业证书 / 开发者证书**：`codesign -f -s "证书名" Payload/WSubscription.app` 后重新打包。
            - 免费 Apple ID 签名有效期 7 天，开发者账号 1 年。

            **说明**

            - 包内没有任何描述文件，也没有签名，无法直接双击安装到设备。
            - 校验值见 `checksum.txt`（SHA-256）。
            - 系统要求：iOS 18.0 及以上。
